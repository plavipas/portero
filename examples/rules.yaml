# Portero rules. Copy to ~/.config/portero/rules.yaml and edit.
# First matching rule wins; every key under `match` must match (host AND path AND opener AND cwd).
# Keep your real hostnames in your local file only.
version: 1

default:
  browser: Dia          # app name as in /Applications, or a bundle id
  profile: Personal     # optional: profile / space / container name

# ask_unmatched: false  # optional, default true: a link from an app that no rule matches shows the panel
#                       # (Keep default, or one of the targets used below; "Remember" appends a host rule)

rules:
  # A group: one target for several conditions. The first child that matches decides; the group's `open`
  # applies. Children have `match` only. The log and the diagram show "Work / name" and draw one node "Work".
  - name: Work
    open: { browser: Dia, profile: Work }
    rules:
      - name: GitHub organisation
        match:
          host: github.com
          path: /work-projects                      # /work-projects and /work-projects/..., not /work-projects-2
      - name: links clicked in Slack
        match:
          opener: com.tinyspeck.slackmacgap         # bundle id of the app that opened the link
      - name: CLI logins from work repositories
        # Links opened from a shell by gh/gcloud/etc. with BROWSER="portero open"; the handler app has no cwd,
        # so this never matches links from other apps.
        match:
          cwd: ~/Documents/projects/work            # this directory and everything below it
      - match:                                      # a child without a name is logged as "Work"
          host: tracker.example.com

  - name: work tools
    match:
      host: [git.example.com, "*.example.net"]      # "*.x" also matches the bare "x"
    open: { browser: Zen }

  - name: team wiki in a Firefox container
    match:
      host: wiki.example.com
    # Zen / Firefox only. Needs the "Open external links in a container" extension in the profile;
    # the container is created on first use if it does not exist. `portero rules check` warns when it is missing.
    open: { browser: Zen, container: Work }

  - name: docs mirrors
    match:
      host: "docs-*.example.org"                    # plain glob, "*" anywhere
    open: { browser: Safari }

  # A rule that always follows `default`, whatever it is later. "Keep default" + Remember adds one of these.
  # - name: example.net
  #   match: { host: example.net }
  #   open: { default: true }
