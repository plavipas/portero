name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Require a tag on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "error: $GITHUB_REF_NAME is not on main; releases are cut from main only" >&2
            exit 1
          }
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - name: Package
        run: |
          VERSION="$GITHUB_REF_NAME" make package
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Portero $GITHUB_REF_NAME" --generate-notes \
            --notes "Install: brew tap plavipas/tap && brew install --cask plavipas/tap/portero

          The app is ad-hoc signed, not notarized. Approve it first: 'open -a Portero' and allow it in System Settings > Privacy & Security > Open Anyway,
          or run: xattr -dr com.apple.quarantine /Applications/Portero.app

          Only then run 'portero rules init' and 'portero default set'. Until approved, 'portero' prints a hint and exits 3." \
            dist/Portero_*.zip dist/checksums.txt
